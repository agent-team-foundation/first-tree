# See https://momentic.ai/docs/cli/configuration
name: first-tree
include:
  - "**/*.test.yaml"
  - "**/*.module.yaml"
retries: 0
parallel: 1
recordVideo: on-fail
gitMainBranch: main
fileFormat: v2
browser:
  autoExpandIframes: true
  disableSecondaryCacheResolution: true
ai:
  # Both default-on features are disabled so a run only ever executes the steps
  # committed here. Failure recovery (beta) would generate and execute extra
  # steps after a failure, and assertion memory would carry verdicts between
  # runs — either one makes a result depend on something outside the repo, which
  # is not a reasonable basis for blocking a merge.
  useMemory: false
  failureRecovery: false
  # Pinned so a model rollout cannot silently change what a step resolves to.
  agentConfig:
    locator: v4.2
    assertion: v4.1
    visual-assertion: v4.0
    text-extraction: v3.0
    failure-recovery: v2.1
environments:
  # Local first-tree stack: web on :5173 (Vite proxies /api/v1 to the server
  # on :8000), postgres from docker-compose. See DEVELOPMENT.md Quickstart.
  - name: first-tree-local
    baseUrl: http://127.0.0.1:5173
    envVariables:
      DATABASE_URL: postgresql://firsttree:firsttree@localhost:5432/firsttree
  # Deployed staging. Note it cannot run the registration/onboarding tests:
  # the dev sign-in stub is (correctly) disabled off localhost, and there is no
  # database access for the onboarding fixtures. See e2e/README.md.
  - name: first-tree-dev-cloud
    baseUrl: https://dev.cloud.first-tree.ai
