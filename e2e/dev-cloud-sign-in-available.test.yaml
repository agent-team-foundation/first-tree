fileType: momentic/test/v2
id: active-hazy-cookies-tracks-shortly
description: Deployed staging serves the landing page and offers a working
  sign-in entry point
defaultEnv: first-tree-dev-cloud
steps:
  - assert: the marketing landing page has rendered with a headline about
      communication infrastructure for AI-native teams and a Get Started call to
      action
  - click: Get Started button
  - waitForUrl: /login
  - assert: the sign-in card offers exactly two identity providers, one for Google
      and one for GitHub, and no username or password fields are present
