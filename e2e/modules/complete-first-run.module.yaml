fileType: momentic/module/v2
description: Register a fresh local user, complete first-run onboarding with
  controlled daemon fixtures, and land in the kickoff chat
id: p0-complete-first-run
steps:
  - module:
      path: ./sign-up-fresh-user.module.yaml

  # Step 1 of 3 — accept the prefilled team name.
  - click: Continue button

  # Step 2 of 3 — a browser test has no second machine, so mirror the daemon's
  # connected-client write and wait for the UI's polling gate to observe it.
  - javascript:
      code: ../scripts/seed-connected-computer.js
      environment: node
      saveAs: FIXTURE_CLIENT_ID
  - assert: the connect-computer step reports a connected computer and lists
      Claude Code as a ready coding agent on it
  - click: Continue button

  # Step 3 of 3 — create the real product agent, then mirror its runtime
  # presence so the onboarding flow can offer its real Start chat action.
  - click: Create agent button
  - javascript:
      code: ../scripts/seed-agent-online.js
      environment: node
      saveAs: FIXTURE_AGENT_ID
  - click: Start chat button

  - waitForUrl: /?c=
