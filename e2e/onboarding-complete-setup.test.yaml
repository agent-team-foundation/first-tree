fileType: momentic/test/v2
id: early-firm-harbor-dreams-poorly
description: A new user completes onboarding end to end and lands in the workspace
defaultEnv: local
steps:
  # The reusable module drives the real registration and onboarding journey.
  - module:
      path: ./modules/complete-first-run-onboarding.module.yaml

  # ── Orientation — the bootstrap is context, not attributed speech ──────────
  - assert: the workspace is open on a chat named Get started with First Tree,
      where a senderless Get to know First Tree Orientation appears instead of
      a user-attributed bootstrap message; Skip intro, Start with the new agent,
      and a message composer addressed to that agent are all available
  - click: the Start with the new agent button in the Orientation
  - assert: the Orientation is now a compact First Tree introduction entry and
      the first attributed timeline message belongs to the user and says I'm
      ready — let's get started

  # ── Team switcher — external-agent entry stays Team-scoped ────────────────
  - click: current team selector in the header
  - assert: the open team menu shows Use your own agent in the Current team
      section, keeps Create team under Add team, and has no Join with invite
      link action
  - click: Use your own agent menu item
  - waitForUrl: /settings/context#coding-agent-access
  - assert: the Context Tree settings page is open at the Coding agent setup
      section, where the new Team cannot configure personal coding-agent access
      until it has a valid Context Tree binding

  # ── Settings — the permanent readiness overview keeps its stable route ────
  - click: Settings link in the top navigation
  - waitForUrl: /settings/account
  - assert: the Settings sidebar contains a Getting Started entry and does not
      contain an entry named Setup
